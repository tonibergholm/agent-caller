# Fuzz targets for the parsers that read untrusted bytes. This is its own
# cargo workspace (like app/src-tauri): the root workspace excludes it, so
# `cargo test --workspace` never builds it. See README.md.
[package]
name = "agent-caller-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
acd-protocol = { path = "../crates/acd-protocol" }
acd-adapters = { path = "../crates/acd-adapters" }
acd-core = { path = "../crates/acd-core" }
acd-client = { path = "../crates/acd-client", features = ["fuzzing"] }
acd-inbox = { path = "../crates/acd-inbox" }
acd-relay = { path = "../crates/acd-relay" }
serde_json = "1"
serde = "1"
tokio = { version = "1", features = ["rt", "io-util", "time", "sync"] }
base64 = "0.23"
toml = "1"
async-trait = "0.1"
axum = "0.8"
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
chrono = "0.4"
jsonschema = { version = "0.58", default-features = false }

[workspace]

[lib]
name = "fuzzlib"
path = "src/lib.rs"

[profile.release]
debug = 1

[[bin]]
name = "protocol_frames"
path = "fuzz_targets/protocol_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing"
path = "fuzz_targets/pairing.rs"
test = false
doc = false
