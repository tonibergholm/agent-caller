# Fuzz targets for the parsers that read untrusted bytes. This is its own
# cargo workspace (like app/src-tauri): the root workspace excludes it, so
# `cargo test --workspace` never builds it. See README.md.
[package]
name = "agent-caller-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
acd-protocol = { path = "../crates/acd-protocol" }
acd-adapters = { path = "../crates/acd-adapters" }
acd-core = { path = "../crates/acd-core" }
acd-client = { path = "../crates/acd-client" }
acd-inbox = { path = "../crates/acd-inbox" }
serde_json = "1"
serde = "1"
tokio = { version = "1", features = ["rt", "io-util"] }
jsonschema = { version = "0.58", default-features = false }

[workspace]

[lib]
name = "fuzzlib"
path = "src/lib.rs"

[profile.release]
debug = 1

[[bin]]
name = "protocol_frames"
path = "fuzz_targets/protocol_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing"
path = "fuzz_targets/pairing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_mapping"
path = "fuzz_targets/hook_mapping.rs"
test = false
doc = false
bench = false

[[bin]]
name = "t3_map"
path = "fuzz_targets/t3_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "herdr_screen"
path = "fuzz_targets/herdr_screen.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inbox_protocol"
path = "fuzz_targets/inbox_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_rules"
path = "fuzz_targets/text_rules.rs"
test = false
doc = false
bench = false
