# THROWAWAY SPIKE (2026-10-12). Not product code. See docs/research/2026-10-12-ios-spike.md.
# A minimal Tauri 2 iOS shell around acd-client and the existing Svelte UI.
# Own workspace, like app/src-tauri, so it stays out of the root workspace.

[package]
name = "agent-caller-ios-spike"
version = "0.0.0-spike"
description = "THROWAWAY iOS spike shell"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace]

[lib]
name = "agent_caller_ios_spike"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
acd-client = { path = "../../../../crates/acd-client" }
acd-protocol = { path = "../../../../crates/acd-protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-clipboard-manager = "=2.4.1"
security-framework = "=3.7.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
