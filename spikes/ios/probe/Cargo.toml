# THROWAWAY SPIKE (2026-10-12). Not product code. Runs acd-client on the iOS simulator.
# Own workspace so it stays out of the root workspace.

[package]
name = "agent-caller-ios-probe"
version = "0.0.0-spike"
description = "THROWAWAY iOS simulator probe for acd-client"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "acd-ios-probe"
path = "src/main.rs"

[dependencies]
acd-client = { path = "../../../crates/acd-client" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
