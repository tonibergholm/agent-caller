[package]
name = "acd-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Relay that turns a content-free wake from acd into a push (spec 2026-11-03-relay-push-design)"

[features]
default = ["server"]
# The wake sender and the minimal HTTP client that acd uses (no server code).
client = []
server = ["client"]

[lib]
name = "acd_relay"

[[bin]]
name = "acd-relay"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
acd-securefs.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
http-body-util = "0.1"
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true

ring = "0.17"
rustls.workspace = true
rustls-pki-types.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
