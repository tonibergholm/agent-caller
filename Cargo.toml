[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
acd-client = { path = "crates/acd-client" }
acd-inbox = { path = "crates/acd-inbox" }
acd-protocol = { path = "crates/acd-protocol" }
acd-core = { path = "crates/acd-core" }
acd-adapters = { path = "crates/acd-adapters" }
acd-securefs = { path = "crates/acd-securefs" }
acd-voice = { path = "crates/acd-voice" }
acd-voice-client = { path = "crates/acd-voice-client" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
gethostname = "1"
getrandom = "0.4"
jsonschema = { version = "0.58", default-features = false }
libc = "0.2"
regex = "1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1.15.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
sha2 = "0.11"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18.1"
