name: Release

# Tag push (v*): run the CI gate, build every artifact, and create a DRAFT
# pre-release. The owner reviews the draft and publishes it by hand.
# workflow_dispatch: the same build without publishing (dry run). Artifacts
# are uploaded to the run; no release is created.
#
# Docs: docs/release.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check versions
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version fields and CHANGELOG
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version=$(scripts/check-version.sh "$REF_NAME")
          else
            # Dry run on a branch: check the manifests but not a tag.
            version=$(scripts/check-version.sh)
            echo "Dry run on $REF_NAME, so the tag is not checked."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  # The same test gate as every push (ci.yml). A release needs it to pass.
  ci:
    uses: ./.github/workflows/ci.yml

  cli:
    name: acd ${{ matrix.target }}
    needs: [prepare, ci]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for each Linux target, not cross images. acd and
          # acd-inbox link only glibc and ring (acd-inbox uses zbus, which is
          # pure Rust, so no libdbus is needed). ubuntu-22.04 sets the glibc
          # floor at 2.35.
          - target: aarch64-apple-darwin
            runner: macos-latest
            linux: false
          - target: x86_64-apple-darwin
            runner: macos-latest
            linux: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            linux: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            linux: true
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build acd
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p acd
      - name: Build acd-inbox
        if: matrix.linux
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p acd-inbox
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: scripts/apple-keychain.sh
      - name: Sign acd with Developer ID
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --keychain "$APPLE_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" \
            "target/$TARGET/release/acd"
          codesign --verify --strict --verbose=2 "target/$TARGET/release/acd"
      - name: Ad-hoc sign acd
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          codesign --force --sign - "target/$TARGET/release/acd"
          echo "acd is ad-hoc signed (no Developer ID certificate configured)."
      - name: Notarize acd
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # A bare Mach-O cannot be stapled. Gatekeeper checks the notary service instead.
          zip_path="$RUNNER_TEMP/acd-notarize.zip"
          /usr/bin/ditto -c -k "target/$TARGET/release/acd" "$zip_path"
          xcrun notarytool submit "$zip_path" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Remove temporary keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_KEYCHAIN != ''
        run: security delete-keychain "$APPLE_KEYCHAIN" || true
      - name: Package tarball
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LINUX: ${{ matrix.linux }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          mkdir -p "$stage" dist
          cp "target/$TARGET/release/acd" "$stage/"
          if [ "$LINUX" = "true" ]; then
            cp "target/$TARGET/release/acd-inbox" "$stage/"
          fi
          cp LICENSE "$stage/"
          tar -czf "dist/acd-$VERSION-$TARGET.tar.gz" -C "$stage" .
          tar -tzf "dist/acd-$VERSION-$TARGET.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  app:
    name: Mac app (aarch64 dmg)
    needs: [prepare, ci]
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build dmg
        # Tauri reads each Apple variable when it is set, even when empty, so
        # unset the empty ones in this shell. Without a certificate, sign ad hoc
        # with the pseudo identity "-", so an empty secret never disables signing.
        working-directory: app
        run: |
          set -euo pipefail
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              unset "$var"
            fi
          done
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            unset APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY=-
            echo "::notice::Ad-hoc signing. No Developer ID certificate is configured."
          else
            echo "::notice::Developer ID signing from APPLE_CERTIFICATE."
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              echo "NOTARIZE=true" >> "$GITHUB_ENV"
              echo "::notice::Notarization enabled."
            else
              echo "::warning::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set. Signing without notarization."
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            fi
          fi
          npx tauri build --bundles dmg --ci
      - name: Verify the bundle
        working-directory: app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Tauri deletes the .app after it packages the dmg, so check the app inside the image.
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          hdiutil verify "$dmg" >/dev/null
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mnt"
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/Agent Caller.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E "^(Authority|Signature|TeamIdentifier)=" || true
          if [ "${NOTARIZE:-}" = "true" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$dmg" "$GITHUB_WORKSPACE/dist/agent-caller-$VERSION-aarch64-apple-darwin.dmg"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-aarch64-apple-darwin
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [prepare, cli, app]
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Write release notes from CHANGELOG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --draft --prerelease --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
