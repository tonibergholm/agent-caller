name: Release

# Tag push (v*): run the CI gate, build every artifact, and create a DRAFT
# pre-release. The owner reviews the draft and publishes it by hand.
# workflow_dispatch: the same build without publishing. The run uploads a
# dist-all artifact with SHA256SUMS, so the dry run can be tested with
# scripts/install.sh --from-dir. No release is created.
#
# Secrets: each APPLE_* secret is passed only to the steps that use it, never
# at job level. Steps that build Rust or install npm packages get no secrets.
# Decision steps receive booleans, never secret values.
#
# Docs: docs/release.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check versions
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check version fields and CHANGELOG
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version=$(scripts/check-version.sh "$REF_NAME")
          else
            # Dry run on a branch: check the manifests but not a tag.
            version=$(scripts/check-version.sh)
            echo "Dry run on $REF_NAME, so the tag is not checked."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  # The same test gate as every push (ci.yml). A release needs it to pass.
  # prepare and ci run in parallel. The build jobs need both.
  ci:
    uses: ./.github/workflows/ci.yml

  cli:
    name: acd ${{ matrix.target }}
    needs: [prepare, ci]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for each Linux target, not cross images. acd and
          # acd-inbox link only glibc and ring (acd-inbox uses zbus, which is
          # pure Rust, so no libdbus is needed). ubuntu-22.04 sets the glibc
          # floor at 2.35.
          - target: aarch64-apple-darwin
            runner: macos-latest
            linux: false
          - target: x86_64-apple-darwin
            runner: macos-latest
            linux: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            linux: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            linux: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head at pin time)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build acd
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p acd
      - name: Build acd-inbox
        if: matrix.linux
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p acd-inbox
      - name: Decide signing mode
        # Receives only booleans derived from the secrets. No secret value
        # reaches this step.
        id: signing
        if: runner.os == 'macOS'
        env:
          HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          HAS_ANY_NOTARY_CREDENTIAL: ${{ secrets.APPLE_ID != '' || secrets.APPLE_PASSWORD != '' || secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERTIFICATE" != "true" ]; then
            echo "developer_id=false" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            if [ "$HAS_ANY_NOTARY_CREDENTIAL" = "true" ]; then
              echo "::warning::Notarization credentials are set but APPLE_CERTIFICATE is not. Notarization needs a Developer ID certificate, so the build is ad hoc."
            fi
            echo "::notice::Ad-hoc signing. No Developer ID certificate is configured."
          elif [ "$HAS_CERTIFICATE_PASSWORD" != "true" ]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is empty. Set the password of the .p12 file."
            exit 1
          else
            echo "developer_id=true" >> "$GITHUB_OUTPUT"
            if [ "$HAS_NOTARY_CREDENTIALS" = "true" ]; then
              echo "notarize=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Developer ID signing and notarization enabled."
            else
              echo "notarize=false" >> "$GITHUB_OUTPUT"
              echo "::warning::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set. Signing without notarization."
            fi
          fi
      - name: Import Developer ID certificate
        id: import
        if: runner.os == 'macOS' && steps.signing.outputs.developer_id == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/apple-keychain.sh
      - name: Sign acd with Developer ID
        if: runner.os == 'macOS' && steps.signing.outputs.developer_id == 'true'
        env:
          TARGET: ${{ matrix.target }}
          APPLE_KEYCHAIN: ${{ steps.import.outputs.keychain }}
          APPLE_SIGNING_IDENTITY: ${{ steps.import.outputs.identity }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --keychain "$APPLE_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" \
            "target/$TARGET/release/acd"
          codesign --verify --strict --verbose=2 "target/$TARGET/release/acd"
      - name: Ad-hoc sign acd
        if: runner.os == 'macOS' && steps.signing.outputs.developer_id != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          codesign --force --sign - "target/$TARGET/release/acd"
          echo "acd is ad-hoc signed (no Developer ID certificate configured)."
      - name: Notarize acd
        if: runner.os == 'macOS' && steps.signing.outputs.notarize == 'true'
        env:
          TARGET: ${{ matrix.target }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # A bare Mach-O cannot be stapled. Gatekeeper checks the notary service instead.
          zip_path="$RUNNER_TEMP/acd-notarize.zip"
          notary_json="$RUNNER_TEMP/notary.json"
          /usr/bin/ditto -c -k "target/$TARGET/release/acd" "$zip_path"
          xcrun notarytool submit "$zip_path" --wait --output-format json \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            > "$notary_json"
          status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$notary_json")
          echo "Notarization status: $status"
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization of acd did not return Accepted (status: ${status:-none})."
            exit 1
          fi
      - name: Remove temporary keychain
        if: always() && runner.os == 'macOS' && steps.signing.outputs.developer_id == 'true'
        env:
          APPLE_KEYCHAIN: ${{ steps.import.outputs.keychain }}
        run: |
          if [ -n "${APPLE_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN" || true
          fi
      - name: Package tarball
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LINUX: ${{ matrix.linux }}
          # Stops tar from adding AppleDouble ._ entries for extended attributes.
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          mkdir -p "$stage" dist
          cp "target/$TARGET/release/acd" "$stage/"
          if [ "$LINUX" = "true" ]; then
            cp "target/$TARGET/release/acd-inbox" "$stage/"
          fi
          cp LICENSE "$stage/"
          tar -czf "dist/acd-$VERSION-$TARGET.tar.gz" -C "$stage" .
          tar -tzf "dist/acd-$VERSION-$TARGET.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          # A re-run of this job replaces its earlier artifact instead of failing.
          overwrite: true

  app:
    name: Mac app (aarch64 dmg)
    needs: [prepare, ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head at pin time)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build the app binary (no signing secrets)
        # Compiles Rust and the frontend. Signing happens in the next step, so
        # this step and its build scripts never see the Apple secrets.
        working-directory: app
        run: npx tauri build --no-bundle --ci
      - name: Bundle and sign the dmg
        # Tauri reads each Apple variable when it is set, even when empty, so
        # unset the empty ones in this shell. Without a certificate, sign ad hoc
        # with the pseudo identity "-", so an empty secret never disables signing.
        id: bundle
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is empty. Set the password of the .p12 file."
            exit 1
          fi
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              unset "$var"
            fi
          done
          notarize=false
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            unset APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY=-
            echo "::notice::Ad-hoc signing. No Developer ID certificate is configured."
          else
            echo "::notice::Developer ID signing from APPLE_CERTIFICATE."
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              notarize=true
              echo "::notice::Notarization enabled."
            else
              echo "::warning::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set. Signing without notarization."
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            fi
          fi
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          npx tauri bundle --bundles dmg --ci
      - name: Verify the bundle
        working-directory: app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTARIZE: ${{ steps.bundle.outputs.notarize }}
        run: |
          set -euo pipefail
          # Tauri deletes the .app after it packages the dmg, so check the app inside the image.
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one dmg in src-tauri/target/release/bundle/dmg, found ${#dmgs[@]}."
            exit 1
          fi
          dmg="${dmgs[0]}"
          hdiutil verify "$dmg" >/dev/null
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mnt"
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/Agent Caller.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E "^(Authority|Signature|TeamIdentifier)=" || true
          if [ "$NOTARIZE" = "true" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$dmg" "$GITHUB_WORKSPACE/dist/agent-caller-$VERSION-aarch64-apple-darwin.dmg"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-app-aarch64-apple-darwin
          path: dist/*.dmg
          if-no-files-found: error
          # A re-run of this job replaces its earlier artifact instead of failing.
          overwrite: true

  checksums:
    name: SHA256SUMS and dry-run bundle
    needs: [prepare, cli, app]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Upload the complete set
        # One artifact with every file, so a dry run can be tested with
        # scripts/install.sh --from-dir. The publish job also downloads it.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-all
          path: dist
          if-no-files-found: error
          # Without this, a re-run fails with "artifact already exists".
          overwrite: true

  publish:
    name: Draft release
    needs: [prepare, checksums]
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-all
          path: dist
      - name: Write release notes from CHANGELOG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Create or replace the draft pre-release
        # Re-running after a partial failure must work. A published release is
        # never touched. An existing draft for this tag is deleted and recreated
        # with the same files. Deleting a draft does not remove the tag. Each
        # draft is re-read right before its deletion, and it is deleted only if
        # it is still a draft for this tag.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$REPO/releases")
          published=$(printf '%s' "$releases" | jq -r --arg tag "$TAG" \
            '.[] | select(.tag_name == $tag and (.draft | not)) | .id')
          if [ -n "$published" ]; then
            echo "::error::Release $TAG is already published. Refusing to change it."
            exit 1
          fi
          draft_ids=$(printf '%s' "$releases" | jq -r --arg tag "$TAG" \
            '.[] | select(.tag_name == $tag and .draft) | .id')
          for draft_id in $draft_ids; do
            # Re-check the live state of this release right before deleting it.
            current=$(gh api "repos/$REPO/releases/$draft_id" --jq '[.tag_name, (.draft | tostring)] | @tsv')
            if [ "$current" != "$(printf '%s\ttrue' "$TAG")" ]; then
              echo "::error::Release $draft_id changed since it was listed ($current). Re-run the workflow."
              exit 1
            fi
            echo "Deleting earlier draft release $draft_id for $TAG"
            gh api -X DELETE "repos/$REPO/releases/$draft_id" >/dev/null
          done
          gh release create "$TAG" dist/* \
            --draft --prerelease --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
