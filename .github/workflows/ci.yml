name: CI

on:
  # Branch pushes only. Tag pushes run this workflow through release.yml.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow as its test gate.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request stops the superseded run, which also drops its
# macOS jobs from the runner queue. Other events get a group of their own, so
# they never cancel or replace each other (and release.yml's gate is unaffected).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head at pin time)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          cargo clippy -p acd-app-core --target aarch64-apple-ios-sim --locked -- -D warnings
          cargo clippy -p acd-app-core --target aarch64-apple-ios --locked -- -D warnings
      # Qt 6 declarative tools for clients/omarchy/tests/run-qml.sh (qmllint and
      # the headless Panel tests). If these packages disappear from the runner
      # image this step fails loudly rather than skipping the QML checks.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtqml qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtqml-workerscript
      - if: matrix.os == 'ubuntu-latest'
        run: clients/omarchy/tests/run-qml.sh
      - if: matrix.os == 'ubuntu-latest'
        run: node --test 'clients/omarchy/tests/*.test.mjs'
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/tests/run.sh

  # Type-check only (no linking, so no NDK or Windows SDK): keeps the client
  # crates building for Windows and Android (PR #79). See scripts/portability-check.sh.
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head at pin time)
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc,aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/portability-check.sh

  app:
    timeout-minutes: 20
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head at pin time)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run verify
