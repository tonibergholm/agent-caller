version: 2
updates:
  # Proposes new commit SHAs for the actions pinned in .github/workflows.
  # Each pin keeps its version in a comment, which Dependabot updates too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # actions/upload-artifact and actions/download-artifact must stay on
    # compatible majors, so their bumps arrive together as one PR.
    groups:
      actions:
        patterns:
          - "*"
  # Reports vulnerable and outdated crates. One entry covers every directory
  # that holds a Cargo.lock: the Tauri, iOS and Android shells, the fuzz
  # targets and the load test are separate workspaces.
  - package-ecosystem: cargo
    directories:
      - /
      - /app/src-tauri
      - /apps/ios/src-tauri
      - /apps/android
      - /fuzz
      - /tools/loadtest
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
