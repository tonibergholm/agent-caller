version: 2
updates:
  # Proposes new commit SHAs for the actions pinned in .github/workflows.
  # Each pin keeps its version in a comment, which Dependabot updates too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # actions/upload-artifact and actions/download-artifact must stay on
    # compatible majors, so their bumps arrive together as one PR.
    groups:
      actions:
        patterns:
          - "*"
