# Load and soak harness for acd. A standalone crate with its own (empty)
# workspace table: `cargo test --workspace` at the repository root never
# builds it, and the root Cargo.lock is untouched. See README.md.
[package]
name = "acd-loadtest"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
acd-client = { path = "../../crates/acd-client" }
acd-core = { path = "../../crates/acd-core", features = ["testing"] }
acd-protocol = { path = "../../crates/acd-protocol" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
