[package]
name = "agent-caller-ios"
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

# Its own workspace, like app/src-tauri: the iOS target and Tauri's mobile
# dependencies stay out of the root workspace.
[workspace]

[lib]
name = "agent_caller_ios"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
acd-app-core = { path = "../../../crates/acd-app-core" }
acd-client = { path = "../../../crates/acd-client" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-clipboard-manager = "=2.4.2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
